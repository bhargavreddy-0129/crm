name: Mini ERP CRM CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies & Validate Build
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Install Frontend Dependencies & Validate Build
        run: |
          cd frontend
          npm ci
          npm run build
