version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: minierp-postgres
    restart: always
    environment:
      POSTGRES_USER: erpuser
      POSTGRES_PASSWORD: erppassword
      POSTGRES_DB: minierp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minierp-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "super-secret-jwt-key-mini-erp-crm-2026"
      NODE_ENV: "production"
    depends_on:
      - postgres

volumes:
  postgres_data:
